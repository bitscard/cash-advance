# Ephemeral Postgres for backend integration tests. No volume, so the DB
# resets every time the container restarts. Listens on port 5433 to avoid
# colliding with any local dev DB on the default 5432.
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   cd node && npm test
#   docker-compose -f docker-compose.test.yml down

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: bits-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: bits_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d bits_test"]
      interval: 2s
      timeout: 5s
      retries: 10
