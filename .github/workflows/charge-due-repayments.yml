name: Charge due repayments

on:
  schedule:
    - cron: '0 17 * * *'  # 17:00 UTC = 12pm EST / 1pm EDT — late enough most paychecks have landed
  workflow_dispatch:       # allows manual trigger from GitHub Actions tab

jobs:
  charge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repayment collection
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.BACKEND_URL }}/api/advance/admin/run-due-repayments" \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json")
          cat /tmp/response.json
          if [ "$response" != "200" ]; then
            echo "Failed with status $response"
            exit 1
          fi
