name: tests

on:
  push:
    branches: [main, Zubeir]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Backend job: Jest unit + integration tests
  # Runs against an ephemeral Postgres service (matches docker-compose.test.yml).
  # ─────────────────────────────────────────────────────────────────────
  backend:
    name: backend tests (Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bits_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d bits_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            if pg_isready -h localhost -p 5433 -U test; then echo ready; break; fi
            sleep 2
          done

      - name: Run all backend tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5433/bits_test
          JWT_SECRET: test-jwt-secret
          ADMIN_TOKEN: test-admin-token
          PLAID_CLIENT_ID: test-client-id
          PLAID_SECRET: test-secret
          PLAID_ENV: sandbox
          STRIPE_SECRET_KEY: sk_test_dummy
          ANTHROPIC_API_KEY: sk-ant-dummy
          # Mailchimp creds intentionally blank so addToMailchimp short-circuits
          MAILCHIMP_API_KEY: ''
          MAILCHIMP_LIST_ID: ''
          MAILCHIMP_SERVER_PREFIX: ''
          TEST_SSNS: 111223333,222334444,333445555,444556666,555667777
        run: npm test -- --runInBand

  # ─────────────────────────────────────────────────────────────────────
  # Frontend job: Vitest unit/component + Playwright E2E
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    name: frontend tests (Vitest + Playwright)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vitest (unit + component)
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Playwright E2E
        # Playwright's config will spin up `npm run dev` as the test server.
        # Frontend only — no backend running. Specs that need a backend (full
        # signup → onboarding flow) live as backend integration tests instead.
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
